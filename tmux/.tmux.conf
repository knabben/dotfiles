# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# ── General settings ──────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # true colour support
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g base-index 1          # windows start at 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0         # no delay for escape sequences

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse off
bind m set-option -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# ── Pane splits ───────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Window navigation ─────────────────────────────────────────────────────────
bind -n M-h previous-window   # Alt+h
bind -n M-l next-window       # Alt+l
bind h select-pane -L
bind l select-pane -R

# ── Resize panes ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vim keybindings) ───────────────────────────────────────────────
set-window-option -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "xsel --clipboard --input 2>/dev/null || true"
bind -T copy-mode-vi Escape send -X cancel

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── TPM plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme settings
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"

# Status bar content
set -g @catppuccin_status_modules_right "session host date_time"
set -g @catppuccin_date_time_text "%H:%M %d-%b"

# Initialise TPM — keep this at the very end of .tmux.conf
run '~/.tmux/plugins/tpm/tpm'
