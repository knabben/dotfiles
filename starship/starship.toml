# Starship prompt — Catppuccin Mocha palette
# https://catppuccin.com/palette — Mocha variant
# Colours: bg=#1e1e2e text=#cdd6f4 blue=#89b4fa green=#a6e3a1
#          red=#f38ba8 yellow=#f9e2af mauve=#cba6f7 teal=#94e2d5

add_newline = false

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
style            = "bold #89b4fa"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style  = "bold #cba6f7"

[git_status]
style     = "bold #f9e2af"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified  = "!${count}"
staged    = "+${count}"
renamed   = "»${count}"
deleted   = "✘${count}"

[cmd_duration]
min_time          = 2000
style             = "#f9e2af"
show_milliseconds = false

[username]
style_user  = "bold #94e2d5"
style_root  = "bold #f38ba8"
show_always = false

[hostname]
style       = "bold #94e2d5"
ssh_only    = true

[python]
symbol = " "
style  = "#f9e2af"

[nodejs]
symbol = " "
style  = "#a6e3a1"

[rust]
symbol = " "
style  = "#f38ba8"

[golang]
symbol = " "
style  = "#89b4fa"
